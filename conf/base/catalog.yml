# Catalog Entries:
#
# #### Matching OA to GTR ####
#
# 1. GTR Data Collection:
#    - Collection of publication data from GTR.
#    - Pipelines for processing raw and intermediate publications data.
#     1.1. Raw Publications:
#         - Pipeline: data_collection_gtr
#         - Dataset: gtr.data_collection.publications.raw
#     1.2. Intermediate Publications:
#         - Pipeline: data_collection_gtr
#         - Dataset: gtr.data_collection.publications.intermediate
#
# 2. OA Data Matching:
#    - Matching OA data to GTR using DOIs.
#     2.1. OA data using GTR DOIs:
#         - Pipeline: data_matching_oa
#         - Raw:
#             - Dataset: oa.data_matching.gtr.doi.raw
#         - Intermediate:
#             - Dataset: oa.data_matching.gtr.doi.intermediate
#
# 3. CR Data Matching:
#    - Matching CR DOIs to GTR publications.
#     3.1. CR DOI matches:
#         - Pipeline: data_matching_oa
#         - Raw:
#             - Dataset: cr.data_matching.gtr.doi.raw
#         - Intermediate:
#             - Dataset: cr.data_matching.gtr.doi.intermediate
#
# 4. OA Search (Reverse Lookup) Data Matching:
#    - Performing reverse lookup for non-DOI GTR publications in OA Search.
#     4.1. Search non-DOI GTR publications:
#         - Pipeline: data_matching_oa
#         - Raw:
#             - Dataset: oa_search.data_matching.gtr.doi.raw
#         - Intermediate:
#             - Dataset: oa_search.data_matching.gtr.doi.intermediate
#         - Best Match:
#             - Dataset: oa_search.data_matching.gtr.doi.best_match.intermediate
#
# 5. Combine non-DOI matches (CR and OA Search):
#    - Combining DOI matches from CR and OA Search for non-DOI GTR publications.
#     5.1. Combined DOI matches:
#         - Pipeline: data_matching_oa
#         - Dataset: oa_search.data_matching.gtr.doi.combined.intermediate
#
# 6. OA Data Collection using DOI (CR) and OA ID (OA):
#    - Collecting OA data using DOIs and OA IDs from CR and OA.
#     6.1. Collection using DOI:
#         - Pipeline: data_matching_oa
#         - Raw:
#             - Dataset: oa.data_matching.gtr.combined.doi.raw
#         - Intermediate:
#             - Dataset: oa.data_matching.gtr.combined.doi.intermediate
#     6.2. Collection using OA ID:
#         - Pipeline: data_matching_oa
#         - Raw:
#             - Dataset: oa.data_matching.gtr.combined.id.raw
#         - Intermediate:
#             - Dataset: oa.data_matching.gtr.combined.id.intermediate
#
# 7. OA Publications:
#    - Mapping GTR publications to OA publications.
#     7.1. Primary Publications:
#         - Pipeline: data_matching_oa
#         - Dataset: oa.publications.gtr.primary
#     7.2. Map back to GTR Publications:
#         - Pipeline: data_matching_oa
#         - Dataset: oa.publications.gtr.map.primary
#
# #### Intent Metrics ####
#
# 8. S2 Intent Data:
#    - Collecting and processing intent metrics from S2.
#     8.1. Raw Data:
#         - Pipeline: data_collection_s2
#         - Citation Details Dataset: s2.citation_details.raw
#         - Paper Details Dataset: s2.paper_details.raw
#     8.2. Intermediate Data:
#         - Pipeline: data_collection_s2
#         - Citation Details Dataset: s2.citation_details.intermediate
#         - Paper Details Dataset: s2.paper_details.intermediate
#
# 9. PDFs:
#    - Collecting and processing PDF data.
#     9.1. Section Details:
#         - Pipeline: data_collection_pdfs
#         - Preprocessed: pdfs.section_details.preprocessed
#         - Raw: pdfs.section_details.raw
#         - Intermediate: pdfs.section_shares.intermediate
#     9.2. PDF Objects:
#         - Pipeline: data_collection_pdfs
#         - Raw Dataset: pdfs.objects.raw
#
# #### Team Science Metrics ####
#
# 10. Authors' Publication Records:
#    - Processing authors' publication datasets for diversity and aggregates.
#     10.1. OA Collection:
#         - Pipeline: data_processing_authors
#         - Raw Dataset: authors.oa_dataset.raw
#     10.2. Aggregates Intermediate:
#         - Pipeline: data_processing_authors
#         - Dataset: authors.{level}.aggregates.intermediate
#     10.3. Diversity Components Intermediate:
#         - Pipeline: data_processing_authors
#         - Dataset: authors.{level}.diversity_components.intermediate
#
# 11. CWTS Topics:
#    - Analysing and calculating CWTS topics and distance matrices.
#     11.1. Input Data:
#         - Pipeline: data_analysis_team_metrics
#         - Dataset: cwts.topics.input
#     11.2. Distance Matrices:
#         - Pipeline: data_analysis_team_metrics
#         - Dataset: cwts.topics.{level}.distance_matrix
#
# 12. Team Metric Scores:
#    - Generating diversity scores for publications and coauthors.
#     12.1. Paper Diversity Scores:
#         - Pipeline: data_analysis_team_metrics
#         - Dataset: publications.{level}.paper_diversity_scores.intermediate
#     12.2. Coauthor Diversity Scores:
#         - Pipeline: data_analysis_team_metrics
#         - Dataset: publications.{level}.coauthor_diversity_scores.intermediate
#
# 13. OA Final Data:
#    - Generating the final OA data for GTR publications.
#     13.1. master Data:
#         - Pipeline: data_generation
#         - Dataset: oa.publications.gtr.master.data
#
# Documentation for this file format can be found in "The Data Catalog":
# https://docs.kedro.org/en/stable/data/data_catalog.html

# -> 0. Global catalog variables:
_pq: &_pq
  type: pandas.ParquetDataset
  credentials: s3_credentials
  filepath: None
  load_args:
    engine: pyarrow

_pq_ptd: &_pq_ptd
  type: partitions.PartitionedDataset
  dataset: 
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  filename_suffix: '.parquet'
  credentials: s3_credentials

_csv: &_csv
  type: pandas.CSVDataset
  credentials: s3_credentials
  filepath: None

_js_ptd: &_js_ptd
  type: partitions.PartitionedDataset
  dataset: json.JSONDataset
  filename_suffix: ".json"
  credentials: s3_credentials

# -> 1. GTR Data Collection:
gtr.data_collection.publications.raw:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/gtr/publications/

gtr.data_collection.publications.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/gtr/publications/main.parquet

# -> 2. OA Data Matching:
oa.data_matching.gtr.doi.raw:
  <<: *_js_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/oa/gtr/doi/

oa.data_matching.gtr.doi.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/oa/gtr/doi/main.parquet
  
# -> 3. CR Data Matching:
cr.data_matching.gtr.doi.raw:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/cr/matches/

cr.data_matching.gtr.doi.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/cr/matches/main.parquet

# -> 4. OA Search Data Matching:
oa_search.data_matching.gtr.doi.raw:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/oa_search/matches/

oa_search.data_matching.gtr.doi.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/oa_search/matches/main.parquet

oa_search.data_matching.gtr.doi.best_match.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/oa_search/best_match/main.parquet

# -> 5. Combine non-DOI matches (CR and OA Search):
oa_search.data_matching.gtr.doi.combined.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/oa_search/combined/main.parquet

# -> 6. OA Data Collection using DOI (CR) and OA ID (OA):
oa.data_matching.gtr.combined.doi.raw:
  <<: *_js_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/oa/gtr/combined/doi/

oa.data_matching.gtr.combined.doi.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/oa/gtr/combined/doi/main.parquet

oa.data_matching.gtr.combined.id.raw:
  <<: *_js_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/oa/gtr/combined/id/

oa.data_matching.gtr.combined.id.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/oa/gtr/combined/id/main.parquet

# -> 7. OA Publications:
oa.publications.gtr.primary:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/03_primary/oa/gtr/publications/main.parquet

oa.publications.gtr.map.primary:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/03_primary/oa/gtr/map/main.parquet

# -> 8. S2 Intent Data:
s2.citation_details.oracle:
  type: dsit_impact.datasets.partitioned_dataset.DefaultablePartitionedDataset
  dataset: 
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  schema: 
    id: string
    pmid: int64
    doi: string
    mag_id: int64
    is_open_access: bool
    pdf_url: string
    influential: bool
    intent: string
    context: string
  filename_suffix: '.parquet'
  credentials: s3_credentials
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/s2/citation_details/

s2.paper_details.oracle:
  type: dsit_impact.datasets.partitioned_dataset.DefaultablePartitionedDataset
  dataset: 
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  schema: 
    id: string
    influential: int64
    is_open_access: bool
    pdf_url: string
  filename_suffix: '.parquet'
  credentials: s3_credentials
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/s2/paper_details/

s2.citation_details.raw:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/s2/citation_details/

s2.paper_details.raw:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/s2/paper_details/

s2.citation_details.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/s2/citation_details/main.parquet
  load_args:
    engine: pyarrow
    columns:
      - 'id'
      - 'pdf_url'
      - 'context'
      - 'doi'
      - 'mag_id'
      - 'pmid'
      - 'intent'
      - "is_open_access"

s2.paper_details.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/s2/paper_details/main.parquet

# -> 9. PDFs:
pdfs.section_details.preprocessed:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/pdfs/citation_details/section_inputs.parquet

pdfs.objects.raw:
  type: partitions.PartitionedDataset
  dataset: dsit_impact.datasets.pdf_dataset.PdfDataset
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/pdfs/objects/
  credentials: s3_credentials

pdfs.section_details.oracle:
  type: dsit_impact.datasets.partitioned_dataset.DefaultablePartitionedDataset
  dataset: 
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  schema: 
    parent_id: string
    doi: string
    mag_id: int64
    pmid: int64
    section_index: int64
    section_heading: string
    main_section_heading: string
  filename_suffix: '.parquet'
  credentials: s3_credentials
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/pdfs/citation_sections/

pdfs.section_details.raw:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/pdfs/citation_sections/

pdfs.section_shares.intermediate:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/pdfs/citation_sections/shares.parquet

# -> 10. Authors publication records:
authors.oa_dataset.raw:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/oa/authors/past_publications/

"authors.{level}.aggregates.intermediate":
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/authors/aggregates/{level}.parquet

"authors.{level}.cumulative_aggregates.intermediate":
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/authors/cumulative_aggregates/{level}.parquet

"authors.{level}.diversity_components.intermediate":
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/authors/diversity_components/{level}.parquet

# -> 11. CWTS Topics:
cwts.topics.input:
  type: pandas.ExcelDataset
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/01_raw/cwts/cwts_oa_topics.xlsx

"cwts.topics.{level}.distance_matrix":
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/cwts/distance_matrices/{level}.parquet

# -> 12. Team Metric Scores:
"publications.{level}.paper_diversity_scores.intermediate":
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/publications/paper_diversity_scores/{level}.parquet

"publications.{level}.coauthor_diversity_scores.intermediate":
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/02_intermediate/publications/coauthor_diversity_scores/{level}.parquet

# -> 13. OA Final Data:
oa.publications.gtr.master.data:
  <<: *_pq
  filepath: s3://igl-dsit-impact/03_publication_metrics/data/04_output/oa/master_data.parquet